[build]
  publish = "."
  # předgenerování obsahu do HTML (viz scripts/prerender.mjs) – kvůli vyhledávačům s AI a náhledům na sítích
  command = "node scripts/reservio.mjs && node scripts/prerender.mjs"
  functions = "netlify/functions"

[[headers]]
  for = "/soutok-kouty/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/demo-portal-vlastnika.html"
  to = "/portal-vlastniku/"
  status = 301

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# === 301 ze starých domén (doména musí být v Netlify přidaná jako alias tohoto webu) ===
