[build]
  publish = "."
  # předgenerování obsahu do HTML (viz scripts/prerender.mjs) – kvůli vyhledávačům s AI a náhledům na sítích
  command = "node scripts/reservio.mjs && node scripts/balicky-ceny.mjs && node scripts/prerender.mjs && node scripts/domeny.mjs"
  functions = "netlify/functions"

[[headers]]
  for = "/soutok-kouty/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/demo-portal-vlastnika.html"
  to = "/portal-vlastniku/"
  status = 301

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# =====================================================================================================
# TŘI DOMÉNY JEDNOHO WEBU
#   nordmoraviaresorts.cz  → celý web (NMR, /soutok-kouty/, /admin/, náhledy)
#   resortcervenydvur.cz   → obsah složky /cerveny-dvur/
#   vila-republika.cz      → obsah složky /vila-republika/
# Obě domény resortů musí být v Netlify přidané jako „domain alias“ tohoto projektu (i s www).
# Pořadí pravidel je důležité – platí první, které sedí. Odkazy, canonical a sitemapy pro domény
# a přesměrování /cerveny-dvur/… z NMR řeší scripts/domeny.mjs při nasazení (proměnná DOMENY_RESORTU=1).
# =====================================================================================================
# www → bez www
[[redirects]]
  from = "https://www.resortcervenydvur.cz/*"
  to = "https://resortcervenydvur.cz/:splat"
  status = 301
  force = true

# www → bez www
[[redirects]]
  from = "https://www.vila-republika.cz/*"
  to = "https://vila-republika.cz/:splat"
  status = 301
  force = true

