[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/soutok-kouty/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/demo-portal-vlastnika.html"
  to = "/portal-vlastniku/"
  status = 301

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
