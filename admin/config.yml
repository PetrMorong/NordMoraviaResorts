# Decap CMS – Nord Moravia Resorts (NMR + Soutok Kouty; další resorty přibudou jako další kolekce)
# Přihlášení: /admin přes Decap Turbo (https://turbo.decapcms.org) – uživatele a role spravuješ v Turbo dashboardu.
# Větev, do které CMS zapisuje, se nastavuje u webu v Turbo dashboardu.
# Role se navazují na NÁZVY kolekcí níže (name:): nmr, nmr_tym, nmr_investice, soutok_web, soutok_apartmany, ...
backend:
  name: turbo-github
  turbo_site_id: DOPLNIT-SITE-ID   # zkopíruj z Turbo dashboardu po vytvoření webu

# Záloha – původní přihlášení přes Netlify Identity (zastaralé, nepoužívat):
# backend:
#   name: git-gateway
#   branch: main
locale: cs
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "nmr"
    label: "Nord Moravia – úvodní stránka"
    files:
      - name: "nastaveni"
        label: "Texty a kontakt"
        file: "data/nmr/nastaveni.json"
        fields:
          - { label: "Hero", name: "hero", widget: "object", fields: [{ label: "Nadpis 1. řádek", name: "nadpis1", widget: "string" }, { label: "Nadpis 2. řádek (kurzíva)", name: "nadpis2", widget: "string" }, { label: "Perex", name: "perex", widget: "text" }] }
          - { label: "Čísla", name: "cisla", widget: "list", fields: [{ label: "Číslo", name: "cislo", widget: "string" }, { label: "Popis", name: "popis", widget: "string" }] }
          - { label: "O nás", name: "o_nas", widget: "object", fields: [{ label: "Nadpis", name: "nadpis", widget: "string" }, { label: "Text", name: "text", widget: "text" }] }
          - { label: "Kontakt", name: "kontakt", widget: "object", fields: [{ label: "E-mail", name: "email", widget: "string" }, { label: "Telefon", name: "telefon", widget: "string" }, { label: "Firma", name: "firma", widget: "string" }, { label: "IČO", name: "ico", widget: "string" }] }
          - { label: "Měření (všechny weby sítě)", name: "mereni", widget: "object", hint: "Jeden kontejner a jeden pixel pro NMR, Červený dvůr, Vilu Republiku i Kouty. Prázdné = nic se nenačte a lišta cookies se nezobrazí.", fields: [{ label: "Google Tag Manager ID", name: "gtm_id", widget: "string", required: false, hint: "např. GTM-ABC1234" }, { label: "Meta Pixel ID", name: "meta_pixel_id", widget: "string", required: false }] }
      - name: "resorty"
        label: "Resorty"
        file: "data/nmr/resorty.json"
        fields:
          - label: "Resorty"
            name: "resorty"
            widget: "list"
            summary: "{{fields.nazev}}"
            fields:
              - { label: "ID (část adresy)", name: "id", widget: "string" }
              - { label: "Název", name: "nazev", widget: "string" }
              - { label: "Typ", name: "typ", widget: "string" }
              - { label: "Místo", name: "misto", widget: "string" }
              - { label: "Barva resortu (HEX)", name: "barva", widget: "string" }
              - { label: "Popis", name: "popis", widget: "text" }
              - { label: "Štítky", name: "stitky", widget: "list", field: { label: "Štítek", name: "stitek", widget: "string" } }
              - { label: "Cena od (text)", name: "cena_od", widget: "string" }
              - { label: "Hlavní fotka", name: "foto", widget: "image" }
              - { label: "Výřez hlavní fotky", name: "foto_pozice", widget: "string", required: false, hint: "Co má zůstat vidět, když se fotka ořízne: vodorovně a svisle v %, např. 30% 50% = budova vlevo od středu" }
              - { label: "Druhá fotka", name: "foto2", widget: "image" }
              - { label: "Web resortu", name: "web", widget: "string" }
              - { label: "Odkaz na rezervaci", name: "rezervace", widget: "string" }
              - { label: "Stav", name: "stav", widget: "select", options: [{label: "Otevřeno", value: "otevreno"}, {label: "Připravujeme", value: "pripravujeme"}] }
      - name: "vyhody"
        label: "Výhody přímé rezervace"
        file: "data/nmr/vyhody.json"
        fields:
          - { label: "Zobrazovat", name: "aktivni", widget: "boolean", default: true, hint: "Zobrazí se na úvodu NMR, Červeného dvora a Vily Republiky a na rezervačních stránkách. Slevu je potřeba mít nastavenou i v Previo!" }
          - { label: "Malý nadpis", name: "kicker", widget: "string" }
          - { label: "Nadpis", name: "nadpis", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Pruh na rezervační stránce – úvod", name: "pruh_nadpis", widget: "string" }
          - { label: "Text v liště na mobilu", name: "lista", widget: "string" }
          - { label: "Výhody", name: "body", widget: "list", summary: "{{fields.nadpis}}", fields: [{ label: "Nadpis", name: "nadpis", widget: "string" }, { label: "Text", name: "text", widget: "text" }] }
      - name: "recenze"
        label: "Recenze hostů"
        file: "data/nmr/recenze.json"
        fields:
          - { label: "Recenze", name: "recenze", widget: "list", summary: "{{fields.jmeno}} – {{fields.resort}}", hint: "Jen skutečné recenze (Google, Booking), ideálně se souhlasem hosta. Prázdný seznam = sekce se nezobrazí.", fields: [{ label: "Text", name: "text", widget: "text" }, { label: "Jméno (např. Jana K.)", name: "jmeno", widget: "string" }, { label: "Resort", name: "resort", widget: "string", required: false }, { label: "Zdroj", name: "zdroj", widget: "string", required: false, hint: "Google / Booking.com" }] }
      - name: "tym"
        label: "Tým"
        file: "data/nmr/tym.json"
        fields:
          - { label: "Lidé", name: "lide", widget: "list", summary: "{{fields.jmeno}}", fields: [{ label: "Jméno", name: "jmeno", widget: "string" }, { label: "Role", name: "role", widget: "string" }, { label: "Popis", name: "bio", widget: "text" }] }

  # Oddělená kolekce, aby šla v rolích zamknout (právní formulace výnosu)
  - name: "investice"
    label: "Nord Moravia – investice"
    files:
      - name: "investice"
        label: "Investice"
        file: "data/nmr/investice.json"
        fields:
          - { label: "Nadpis", name: "nadpis", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Výnos (velké číslo)", name: "vynos", widget: "string" }
          - { label: "Popis výnosu", name: "vynos_popis", widget: "string" }
          - { label: "Body", name: "body", widget: "list", fields: [{ label: "Nadpis", name: "nadpis", widget: "string" }, { label: "Text", name: "text", widget: "text" }] }
          - { label: "Upozornění", name: "upozorneni", widget: "string" }
          - { label: "Odkaz na prodej apartmánů", name: "apartmany_url", widget: "string" }

  - name: "web"
    label: "Soutok Kouty – texty a nastavení"
    files:
      - name: "nastaveni"
        label: "Nastavení a úvod"
        file: "soutok-kouty/data/nastaveni.json"
        fields:
          - { label: "Režim", name: "rezim", widget: "select", options: [{label: "Nezávazná poptávka (bez platby)", value: "poptavka"}, {label: "Ostrá rezervace (Previo)", value: "rezervace"}, {label: "Jen předregistrace", value: "predregistrace"}] }
          - { label: "Oznámení v hero (prázdné = skrýt)", name: "oznameni", widget: "string", required: false }
          - { label: "První termín k rezervaci", name: "prvni_termin", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Nadpis – 1. řádek", name: "radek1", widget: "string" }
              - { label: "Nadpis – 2. řádek (kurzíva)", name: "radek2", widget: "string" }
              - { label: "Perex", name: "perex", widget: "text" }
              - { label: "Fotka", name: "foto", widget: "image" }
          - label: "Úvod"
            name: "uvod"
            widget: "object"
            fields:
              - { label: "Nadpis", name: "nadpis", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Fakta (3 čísla)", name: "fakta", widget: "list", fields: [{ label: "Číslo", name: "cislo", widget: "string" }, { label: "Popis", name: "popis", widget: "string" }] }
          - label: "Kontakt"
            name: "kontakt"
            widget: "object"
            fields:
              - { label: "Telefon", name: "telefon", widget: "string" }
              - { label: "E-mail", name: "email", widget: "string" }
              - { label: "Adresa", name: "adresa", widget: "string" }
              - { label: "Odkaz na mapu", name: "mapa_url", widget: "string" }
          - { label: "Místní poplatek (Kč / osoba / noc)", name: "mistni_poplatek", widget: "number" }
          - { label: "Check-in", name: "check_in", widget: "string" }
          - { label: "Check-out", name: "check_out", widget: "string" }
          - { label: "Previo – ID hotelu", name: "previo_hotel_id", widget: "string", required: false, hint: "Vyplní se při napojení na Previo" }

      - name: "wellness"
        label: "Wellness"
        file: "soutok-kouty/data/wellness.json"
        fields:
          - { label: "Nadpis", name: "nadpis", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Cena (text)", name: "cena", widget: "string" }
          - { label: "Položky", name: "polozky", widget: "list", fields: [{ label: "Název", name: "nazev", widget: "string" }, { label: "Popis", name: "popis", widget: "string" }] }
          - { label: "Fotky (3)", name: "fotky", widget: "list", field: { label: "Fotka", name: "foto", widget: "image" } }

      - name: "bistro"
        label: "Bistro"
        file: "soutok-kouty/data/bistro.json"
        fields:
          - { label: "Nadpis (část za čárkou bude kurzívou)", name: "nadpis", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Otevírací doba", name: "oteviraci_doba", widget: "list", fields: [{ label: "Co", name: "co", widget: "string" }, { label: "Kdy", name: "kdy", widget: "string" }] }
          - { label: "Fotky (3)", name: "fotky", widget: "list", field: { label: "Fotka", name: "foto", widget: "image" } }

      - name: "okoli"
        label: "Okolí a doprava"
        file: "soutok-kouty/data/okoli.json"
        fields:
          - label: "Místa"
            name: "mista"
            widget: "list"
            fields:
              - { label: "Název", name: "nazev", widget: "string" }
              - { label: "Vzdálenost", name: "vzdalenost", widget: "string" }
              - { label: "Popis", name: "popis", widget: "string" }
              - { label: "Sezóna", name: "sezona", widget: "select", options: [{label: "Zima", value: "zima"}, {label: "Léto", value: "leto"}, {label: "Celoročně", value: "celorocne"}] }
          - { label: "Doprava", name: "doprava", widget: "list", fields: [{ label: "Odkud", name: "odkud", widget: "string" }, { label: "Kolik", name: "kolik", widget: "string" }] }

      - name: "faq"
        label: "Časté dotazy"
        file: "soutok-kouty/data/faq.json"
        fields:
          - { label: "Otázky", name: "otazky", widget: "list", fields: [{ label: "Otázka", name: "otazka", widget: "string" }, { label: "Odpověď", name: "odpoved", widget: "text" }] }

      - name: "galerie"
        label: "Galerie"
        file: "soutok-kouty/data/galerie.json"
        fields:
          - { label: "Fotky", name: "fotky", widget: "list", fields: [{ label: "Fotka", name: "src", widget: "image" }, { label: "Popisek", name: "popis", widget: "string" }] }

  - name: "ubytovani"
    label: "Soutok Kouty – ubytování a ceny"
    files:
      - name: "apartmany"
        label: "Typy apartmánů"
        file: "soutok-kouty/data/apartmany.json"
        fields:
          - label: "Typy"
            name: "typy"
            widget: "list"
            summary: "{{fields.nazev}} – od {{fields.cena_noc}} Kč"
            fields:
              - { label: "ID (bez mezer)", name: "id", widget: "string" }
              - { label: "Název", name: "nazev", widget: "string" }
              - { label: "Krátký popis", name: "perex", widget: "text" }
              - { label: "Plocha (text)", name: "plocha", widget: "string" }
              - { label: "Max. osob", name: "osoby", widget: "number" }
              - { label: "Lůžka", name: "luzka", widget: "string" }
              - { label: "Počet apartmánů tohoto typu", name: "pocet", widget: "number" }
              - { label: "Cena od (Kč / noc, plán Flexibilní)", name: "cena_noc", widget: "number" }
              - { label: "Typ fotek", name: "foto_typ", widget: "select", options: ["Skutečné foto", "Vizualizace"] }
              - { label: "Fotky", name: "fotky", widget: "list", field: { label: "Fotka", name: "foto", widget: "image" } }
              - { label: "Vybavení", name: "vybaveni", widget: "list", field: { label: "Položka", name: "polozka", widget: "string" } }
              - { label: "Previo – ID typu pokoje", name: "previo_id", widget: "string", required: false }

      - name: "plany"
        label: "Cenové plány"
        file: "soutok-kouty/data/cenove-plany.json"
        fields:
          - label: "Plány"
            name: "plany"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Název", name: "nazev", widget: "string" }
              - { label: "Popis", name: "popis", widget: "string" }
              - { label: "Storno podmínky", name: "storno", widget: "string" }
              - { label: "Koeficient ceny (1 = základ, 0.9 = −10 %)", name: "koeficient", widget: "number", value_type: "float", step: 0.01 }
              - { label: "Doporučeno (ukázat cenu z portálů)", name: "doporuceno", widget: "boolean", default: false }

      - name: "doplnky"
        label: "Doplňky k pobytu"
        file: "soutok-kouty/data/doplnky.json"
        fields:
          - label: "Doplňky"
            name: "doplnky"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Název", name: "nazev", widget: "string" }
              - { label: "Popis", name: "popis", widget: "string" }
              - { label: "Cena (Kč, 0 = dle ceníku)", name: "cena", widget: "number" }
              - { label: "Účtuje se za", name: "jednotka", widget: "select", options: ["pobyt", "noc", "osoba"] }

  # ── Vila Republika (/vila-republika/) ─────────────────────────────
  # Fotky: Cloudinary ID (např. vilaRepublikaFoto/byt5/LL406469-HDR-min_ks7xwb) nebo nahraný obrázek.
  - name: "vr_web"
    label: "Vila Republika – texty a nastavení"
    files:
      - name: "nastaveni"
        label: "Nastavení, úvod, kontakt, poukazy"
        file: "vila-republika/data/nastaveni.json"
        fields:
          - { label: "Hero – fotka", name: "hero_foto", widget: "image", hint: "Cloudinary ID nebo nahraný obrázek" }
          - { label: "Hero – nadpis", name: "hero_nadpis", widget: "string", hint: "*text* = zvýraznění barvou" }
          - { label: "Hero – perex", name: "hero_perex", widget: "text" }
          - { label: "Fakta pod hero", name: "fakta", widget: "list", fields: [{ label: "Číslo", name: "cislo", widget: "string" }, { label: "Text", name: "text", widget: "string" }] }
          - { label: "Úvod – nadpis", name: "intro_nadpis", widget: "string" }
          - { label: "Úvod – text", name: "intro_text", widget: "text" }
          - { label: "Úvod – fotka", name: "intro_foto", widget: "image" }
          - { label: "Previo hotel ID", name: "previo_hotel_id", widget: "string" }
          - { label: "Odkaz na rezervaci wellness (Reservio)", name: "reservio_url", widget: "string" }
          - { label: "Check-in", name: "check_in", widget: "string" }
          - { label: "Check-out", name: "check_out", widget: "string" }
          - label: "Kontakt"
            name: "kontakt"
            widget: "object"
            fields:
              - { label: "E-mail", name: "email", widget: "string" }
              - { label: "Telefon", name: "telefon", widget: "string", required: false }
              - { label: "Adresa", name: "adresa", widget: "string" }
              - { label: "Odkaz na mapu", name: "mapa", widget: "string" }
              - { label: "Provozovatel", name: "provozovatel", widget: "string" }
              - { label: "Facebook", name: "facebook", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
          - { label: "Recenze", name: "recenze", widget: "list", fields: [{ label: "Text", name: "text", widget: "text" }, { label: "Autor", name: "autor", widget: "string" }] }
          - label: "Dárkové poukazy"
            name: "poukazy"
            widget: "object"
            fields:
              - { label: "Nadpis", name: "nadpis", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Hodnoty", name: "hodnoty", widget: "list", field: { label: "Hodnota", name: "hodnota", widget: "string" } }
      - name: "sluzby"
        label: "Wellness, společenská místnost, vybavení"
        file: "vila-republika/data/sluzby.json"
        fields:
          - label: "Wellness"
            name: "wellness"
            widget: "object"
            fields:
              - { label: "Nadpis", name: "nadpis", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Cena pro veřejnost", name: "cena", widget: "string" }
              - { label: "Vybavení", name: "vybaveni", widget: "list", field: { label: "Položka", name: "polozka", widget: "string" } }
              - { label: "Fotky (2)", name: "fotky", widget: "list", field: { label: "Fotka", name: "foto", widget: "image" } }
          - label: "Společenská místnost"
            name: "spolecenska"
            widget: "object"
            fields:
              - { label: "Nadpis", name: "nadpis", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Fotky (2)", name: "fotky", widget: "list", field: { label: "Fotka", name: "foto", widget: "image" } }
          - { label: "Další vybavení", name: "dalsi", widget: "list", fields: [{ label: "Název", name: "nazev", widget: "string" }, { label: "Text", name: "text", widget: "string" }] }
      - name: "okoli"
        label: "Okolí"
        file: "vila-republika/data/okoli.json"
        fields:
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Fotka", name: "foto", widget: "image" }
          - { label: "Místa", name: "mista", widget: "list", fields: [{ label: "Název", name: "nazev", widget: "string" }, { label: "Text", name: "text", widget: "string" }, { label: "Vzdálenost", name: "vzdalenost", widget: "string" }] }

  - name: "vr_apartmany"
    label: "Vila Republika – apartmány"
    files:
      - name: "apartmany"
        label: "Apartmány"
        file: "vila-republika/data/apartmany.json"
        fields:
          - label: "Apartmány"
            name: "apartmany"
            widget: "list"
            summary: "{{fields.nazev}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Zobrazit na webu", name: "aktivni", widget: "boolean", hint: "Vypnout, pokud apartmán nejde rezervovat v Previu" }
              - { label: "Název", name: "nazev", widget: "string" }
              - { label: "Podtitul", name: "podtitul", widget: "string" }
              - { label: "Počet osob", name: "osoby", widget: "string" }
              - { label: "Plocha / ložnice", name: "plocha", widget: "string", required: false }
              - { label: "Lůžka", name: "luzka", widget: "string", required: false }
              - { label: "Popis", name: "popis", widget: "text" }
              - { label: "Fotky", name: "fotky", widget: "list", field: { label: "Fotka", name: "foto", widget: "image" } }
          - { label: "Vybavení všech apartmánů", name: "vybaveni", widget: "list", field: { label: "Položka", name: "polozka", widget: "string" } }

  # ── Resort Červený dvůr (/cerveny-dvur/) ──────────────────────────
  - name: "cd_web"
    label: "Červený dvůr – resort"
    files:
      - name: "nastaveni"
        label: "Úvod, kontakt, historie"
        file: "cerveny-dvur/data/nastaveni.json"
        fields:
          - { label: "Hero – fotka (záložní)", name: "hero_foto", widget: "image", hint: "Cloudinary ID nebo nahraný obrázek" }
          - { label: "Hero – prolínající se fotky", name: "hero_fotky", widget: "list", field: { label: "Fotka", name: "foto", widget: "image" } }
          - { label: "Zábava v areálu", name: "zabava", widget: "object", fields: [{ label: "Nadpis", name: "nadpis", widget: "string" }, { label: "Text", name: "text", widget: "text" }, { label: "Položky", name: "polozky", widget: "list", field: { label: "Položka", name: "polozka", widget: "string" } }, { label: "Fotka (záložní)", name: "foto", widget: "image" }, { label: "Fotky (3)", name: "fotky", widget: "list", field: { label: "Fotka", name: "foto", widget: "image" } }] }
          - { label: "Galerie", name: "galerie", widget: "list", summary: "{{fields.popis}}", hint: "Ideálně 14 fotek – mřížka se pak zaplní celá", fields: [{ label: "Fotka", name: "foto", widget: "image" }, { label: "Popisek", name: "popis", widget: "string" }] }
