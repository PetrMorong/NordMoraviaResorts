          - { label: "Pro firmy", name: "firmy", widget: "object", fields: [{ label: "Nadpis", name: "nadpis", widget: "string" }, { label: "Text", name: "text", widget: "text" }, { label: "Fotka", name: "foto", widget: "image" }] }
